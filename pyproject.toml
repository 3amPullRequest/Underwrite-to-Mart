[project]
name = "underwrite-to-mart"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "dagster>=1.13.20",
    "dagster-polars>=0.27.12",
    "dagster-webserver>=1.13.20",
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "pandera>=0.33.0",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "typer",
]

[project.scripts]
uw = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.dagster]
module_name = "src.pipeline.definitions"
